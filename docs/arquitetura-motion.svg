<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1373" width="1000" height="1373" font-family="'Segoe UI Variable Display','Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3EEFF"/><stop offset="0.55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F7FF"/></linearGradient>
<linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7B5CFF" stop-opacity="0"/><stop offset="1" stop-color="#7B5CFF" stop-opacity="0.2"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#1B1F3B" flood-opacity="0.16"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
<marker id="ar" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#1B1F3B"/></marker>
</defs>
<rect width="1000" height="1373" fill="url(#bg)"/>
<circle cx="930" cy="110" r="160" fill="#FF7AC6" opacity="0.14" filter="url(#glow)"/>
<circle cx="70" cy="1243" r="180" fill="#2F9BFF" opacity="0.13" filter="url(#glow)"/>
<rect x="-60" y="576.66" width="700" height="28" rx="14" fill="url(#trail)" transform="rotate(-12 300 576.66)"/>
<rect x="520" y="1273" width="600" height="24" rx="12" fill="url(#trail)" transform="rotate(-12 800 1273)"/>
<text x="50" y="85" font-size="42" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="50" dy="0">Um único núcleo governa todo o</tspan><tspan x="50" dy="52">Antigravity</tspan></text><text x="52" y="177" font-size="24" fill="#5B6286" font-weight="400" text-anchor="start"><tspan x="52" dy="0">Ecossistema agy-config — plugins, skills, MCPs, hooks e estações</tspan><tspan x="52" dy="32">sincronizadas</tspan></text><ellipse cx="500" cy="410" rx="380" ry="85" fill="none" stroke="#7B5CFF" stroke-width="3" stroke-dasharray="8 8" opacity="0.55"/><circle cx="500" cy="410" r="80" fill="#7B5CFF" stroke="#fff" stroke-width="8" filter="url(#sh)"/><text x="500" y="404" font-size="26" fill="#fff" font-weight="900" text-anchor="middle"><tspan x="500" dy="0">AGY CORE</tspan></text><text x="500" y="432" font-size="17" fill="#fff" font-weight="600" text-anchor="middle"><tspan x="500" dy="0">~/.gemini/config</tspan></text><circle cx="500.0" cy="325.0" r="32" fill="#2F9BFF" stroke="#fff" stroke-width="4" filter="url(#sh)"/><text x="500.0" y="332.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">Plugins</tspan></text><circle cx="829.1" cy="367.5" r="32" fill="#16C79A" stroke="#fff" stroke-width="4" filter="url(#sh)"/><text x="829.0896534380867" y="374.5" font-size="13" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="829.0896534380867" dy="0">Skills</tspan></text><circle cx="829.1" cy="452.5" r="32" fill="#FFB300" stroke="#fff" stroke-width="4" filter="url(#sh)"/><text x="829.0896534380868" y="459.5" font-size="13" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="829.0896534380868" dy="0">MCPs</tspan></text><circle cx="500.0" cy="495.0" r="32" fill="#FF5A6E" stroke="#fff" stroke-width="4" filter="url(#sh)"/><text x="500.0" y="502.0" font-size="13" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">Hooks</tspan></text><circle cx="170.9" cy="452.5" r="32" fill="#FF7AC6" stroke="#fff" stroke-width="4" filter="url(#sh)"/><text x="170.9103465619134" y="459.5" font-size="13" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="170.9103465619134" dy="0">Ollama</tspan></text><circle cx="170.9" cy="367.5" r="32" fill="#2F9BFF" stroke="#fff" stroke-width="4" filter="url(#sh)"/><text x="170.91034656191334" y="374.5" font-size="13" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="170.91034656191334" dy="0">Perfis</tspan></text><g filter="url(#sh)"><rect x="50.0" y="530" width="441.0" height="206.60000000000002" rx="24" fill="#fff"/><rect x="50.0" y="530" width="12" height="206.60000000000002" rx="6" fill="#7B5CFF"/></g><text x="82.0" y="578.1" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82.0" dy="0">Hierarquia em Escada</tspan></text><text x="82.0" y="615.4" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82.0" dy="0">Cérebro (Argon → Opus) planeja;</tspan><tspan x="82.0" dy="29.700000000000003">Rápidos (Flash 3.8 → Sonnet)</tspan><tspan x="82.0" dy="29.700000000000003">leem sem limite de arquivo e</tspan><tspan x="82.0" dy="29.700000000000003">despacham aos locais.</tspan></text><g filter="url(#sh)"><rect x="509.0" y="530" width="441.0" height="206.60000000000002" rx="24" fill="#fff"/><rect x="509.0" y="530" width="12" height="206.60000000000002" rx="6" fill="#2F9BFF"/></g><text x="541.0" y="578.1" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="541.0" dy="0">12 Plugins &amp; 97 Skills</tspan></text><text x="541.0" y="615.4" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="541.0" dy="0">Catálogo modular com curadoria</tspan><tspan x="541.0" dy="29.700000000000003">ativa (skills.json) que filtra</tspan><tspan x="541.0" dy="29.700000000000003">skills 3D ociosas preservando o</tspan><tspan x="541.0" dy="29.700000000000003">orçamento de contexto.</tspan></text><g filter="url(#sh)"><rect x="50.0" y="754.6" width="441.0" height="206.60000000000002" rx="24" fill="#fff"/><rect x="50.0" y="754.6" width="12" height="206.60000000000002" rx="6" fill="#16C79A"/></g><text x="82.0" y="802.7" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82.0" dy="0">13 Servidores MCP</tspan></text><text x="82.0" y="840.0" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82.0" dy="0">Conexão direta com</tspan><tspan x="82.0" dy="29.700000000000003">ollama-router, rag semântico,</tspan><tspan x="82.0" dy="29.700000000000003">filesystem, github, playwright,</tspan><tspan x="82.0" dy="29.700000000000003">context7 e colab.</tspan></text><g filter="url(#sh)"><rect x="509.0" y="754.6" width="441.0" height="206.60000000000002" rx="24" fill="#fff"/><rect x="509.0" y="754.6" width="12" height="206.60000000000002" rx="6" fill="#FFB300"/></g><text x="541.0" y="802.7" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="541.0" dy="0">Hooks de Ciclo de Vida</tspan></text><text x="541.0" y="840.0" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="541.0" dy="0">SessionStart detecta hardware</tspan><tspan x="541.0" dy="29.700000000000003">da estação; PreInvocation</tspan><tspan x="541.0" dy="29.700000000000003">injeta contexto da vault; Stop</tspan><tspan x="541.0" dy="29.700000000000003">audita a integridade da sessão.</tspan></text><g filter="url(#sh)"><rect x="50.0" y="979.2" width="441.0" height="236.3" rx="24" fill="#fff"/><rect x="50.0" y="979.2" width="12" height="236.3" rx="6" fill="#FF5A6E"/></g><text x="82.0" y="1027.3" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="82.0" dy="0">Executores Locais Ollama</tspan></text><text x="82.0" y="1064.6" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="82.0" dy="0">Fila serial estrita</tspan><tspan x="82.0" dy="29.700000000000003">(NUM_PARALLEL=1) com</tspan><tspan x="82.0" dy="29.700000000000003">gpt-oss:20b, Qwen3-Coder-Next</tspan><tspan x="82.0" dy="29.700000000000003">36 GB e Nemotron 30B sem</tspan><tspan x="82.0" dy="29.700000000000003">saturar memória.</tspan></text><g filter="url(#sh)"><rect x="509.0" y="979.2" width="441.0" height="206.60000000000002" rx="24" fill="#fff"/><rect x="509.0" y="979.2" width="12" height="206.60000000000002" rx="6" fill="#FF7AC6"/></g><text x="541.0" y="1027.3" font-size="26" fill="#1B1F3B" font-weight="800" text-anchor="start"><tspan x="541.0" dy="0">Multi-Estação Portável</tspan></text><text x="541.0" y="1064.6" font-size="22" fill="#3C4268" font-weight="400" text-anchor="start"><tspan x="541.0" dy="0">Mesma base declarativa</tspan><tspan x="541.0" dy="29.700000000000003">sincronizada entre Windows 11</tspan><tspan x="541.0" dy="29.700000000000003">(Dell Pro Max e 5860) e macOS</tspan><tspan x="541.0" dy="29.700000000000003">Apple Silicon (Mac M5 Pro).</tspan></text><g filter="url(#sh)"><rect x="50" y="1233.5" width="900" height="90.1" rx="28" fill="#1B1F3B"/></g><text x="500.0" y="1276.5" font-size="23" fill="#fff" font-weight="800" text-anchor="middle"><tspan x="500.0" dy="0">Configuração declarativa única: troque de estação mantendo o mesmo</tspan><tspan x="500.0" dy="31.05">cérebro, ferramentas e regras.</tspan></text>
</svg>